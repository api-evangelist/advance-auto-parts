openapi: 3.2.0
info:
  title: Advance Auto Parts Commerce Cart API
  description: The Advance Auto Parts Commerce API enables ordering, cart management, loyalty program integration, and order fulfillment for commercial accounts. Supports creating orders, managing Speed Perks loyalty points, tracking shipments, and accessing purchase history for fleet and professional installer accounts.
  version: '1'
  contact:
    name: Advance Auto Parts Commercial Support
    url: https://www.advanceautoparts.com/i/help/commercial-accounts
  termsOfService: https://www.advanceautoparts.com/i/policies/terms-and-conditions
  license:
    name: Advance Auto Parts Terms of Service
    url: https://www.advanceautoparts.com/i/policies/terms-and-conditions
servers:
- url: https://api.advanceautoparts.com/commerce/v1
  description: Advance Auto Parts Commerce API Production
security:
- oauth2: []
tags:
- name: Cart
  description: Shopping cart management
paths:
  /cart:
    get:
      operationId: getCart
      summary: Advance Auto Parts Get Current Cart
      description: Retrieve the current shopping cart contents for the authenticated session.
      tags:
      - Cart
      responses:
        '200':
          description: Current cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
              examples:
                getCart200Example:
                  summary: Default getCart 200 response
                  x-microcks-default: true
                  value:
                    id: cart-abc123
                    items:
                    - productId: SKU-123456
                      quantity: 2
                      unitPrice: 54.99
                    subtotal: 109.98
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                getCart401Example:
                  summary: Default getCart 401 response
                  x-microcks-default: true
                  value:
                    code: UNAUTHORIZED
                    message: Authentication required
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      operationId: addToCart
      summary: Advance Auto Parts Add Item to Cart
      description: Add a product to the shopping cart.
      tags:
      - Cart
      requestBody:
        required: true
        description: Item to add to cart.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemInput'
            examples:
              addToCartRequestExample:
                summary: Default addToCart request
                x-microcks-default: true
                value:
                  productId: SKU-123456
                  quantity: 2
      responses:
        '200':
          description: Updated cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
              examples:
                addToCart200Example:
                  summary: Default addToCart 200 response
                  x-microcks-default: true
                  value:
                    id: cart-abc123
                    items:
                    - productId: SKU-123456
                      quantity: 2
                      unitPrice: 54.99
                    subtotal: 109.98
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                addToCart401Example:
                  summary: Default addToCart 401 response
                  x-microcks-default: true
                  value:
                    code: UNAUTHORIZED
                    message: Authentication required
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    CartItemInput:
      type: object
      description: Request to add an item to the cart.
      required:
      - productId
      - quantity
      properties:
        productId:
          type: string
          description: Product SKU to add.
          example: SKU-123456
        quantity:
          type: integer
          description: Quantity to add.
          example: 2
    CartItem:
      type: object
      description: An item in the shopping cart.
      properties:
        productId:
          type: string
          description: Product SKU.
          example: SKU-123456
        quantity:
          type: integer
          description: Quantity of the item.
          example: 2
        unitPrice:
          type: number
          format: float
          description: Price per unit.
          example: 54.99
    ErrorResponse:
      type: object
      description: API error response.
      properties:
        code:
          type: string
          description: Error code.
          example: NOT_FOUND
        message:
          type: string
          description: Error message.
          example: The requested resource was not found.
    Cart:
      type: object
      description: A shopping cart.
      properties:
        id:
          type: string
          description: Cart identifier.
          example: cart-abc123
        items:
          type: array
          description: Items in the cart.
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          type: number
          format: float
          description: Cart subtotal before tax.
          example: 109.98
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.advanceautoparts.com/oauth/authorize
          tokenUrl: https://auth.advanceautoparts.com/oauth/token
          scopes:
            catalog:read: Read product catalog
            orders:read: Read order history
            orders:write: Place and manage orders
            loyalty:read: Read loyalty account
